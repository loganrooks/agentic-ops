name: Claude PR Review (centralized)

# Reusable workflow for AI-led PR review.
#
# Centralized concerns (owned here):
#   * trusted-actor + trigger-phrase gate
#   * mode dispatcher (review / quick / deep / gates / opus / survey / audit)
#   * claude-code-action invocation + allowedTools allowlist
#   * the post-comment wrapper script (closes Comment-and-Control)
#   * concurrency group, timeout, permissions
#
# Per-repo concerns (passed via inputs by the caller):
#   * which modes are enabled for this repo (enabled_modes)
#   * priority paths in 'review' mode (review_focus_paths)
#   * file matchers in 'gates' mode (gates_paths)
#   * AGENTS.md location and human-friendly repo label
#
# Consumer caller stub (~15 lines):
#
#   on:
#     issue_comment:
#       types: [created]
#   permissions:
#     contents: read
#     pull-requests: write
#     issues: write
#     id-token: write
#   jobs:
#     review:
#       uses: loganrooks/agentic-ops/.github/workflows/review.yml@v1
#       with:
#         enabled_modes: '["review","quick","deep","opus","survey","audit"]'
#         review_focus_paths: |
#           src/important.py
#       secrets:
#         claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

on:
  workflow_call:
    inputs:
      enabled_modes:
        description: |-
          JSON array of mode names this repo supports, drawn from the
          central registry: review, quick, deep, gates, opus, survey, audit.
          Modes not listed are rejected at dispatch with an explanatory error.
        required: false
        type: string
        default: '["review","quick","deep","opus","survey","audit"]'
      review_focus_paths:
        description: |-
          Newline-separated paths or globs to prioritize in 'review' mode.
          Empty (default) means no priority — the diff is treated uniformly.
        required: false
        type: string
        default: ""
      gates_paths:
        description: |-
          Newline-separated paths or globs for 'gates' mode. Required if
          'gates' is in enabled_modes. If empty, 'gates' mode posts a
          single comment explaining it is not configured for this repo.
        required: false
        type: string
        default: ""
      audit_lens_registry:
        description: |-
          JSON object mapping audit lens ids to lens prompts. Callers may
          override to add repo-specific lenses; the default registry includes
          the four built-in lenses defined by ADR-001.
        required: false
        type: string
        default: >-
          {
            "agential-dx": "Survey workspace organization for AI contributors: AGENTS.md/CLAUDE.md, ADR coverage, runbooks, context freshness, and contribution guidance.",
            "tech-debt": "Find refactor candidates by signal density: TODO/FIXME/HACK concentration, large or high-churn files, duplication, stale scaffolding, and doc-code drift.",
            "forward-compat": "Assess readiness for the next roadmap phase: architectural fit, likely refactors, ADR pressure, and pre-work that should happen before the phase begins.",
            "discipline": "Audit AGENTS.md and ADR commitments against the repo: forbidden behaviors, required patterns, hook-enforced checks, and discipline-only drift."
          }
      extra_allowed_tools:
        description: |-
          Optional comma-separated claude-code-action allowedTools entries for
          caller-provided diagnostics. STATIC ANALYSIS ONLY. DO NOT add test runners,
          installers, build tools, network fetchers, or code-execution surfaces.
        required: false
        type: string
        default: ""
      agents_md_path:
        description: |-
          Path to AGENTS.md within pr-head/. Default 'AGENTS.md', i.e.
          'pr-head/AGENTS.md'. Used by Claude as the operative discipline
          source; missing file is tolerated (Claude proceeds without it).
        required: false
        type: string
        default: "AGENTS.md"
      repo_label:
        description: |-
          Human-friendly repo name used in the prompt's framing line.
          Default: github.event.repository.name (the consumer's repo).
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Job timeout in minutes. Default 45."
        required: false
        type: number
        default: 45
      effort_level:
        description: |-
          Orthogonal effort dial that scales model choice and per-mode
          attention across the seven review modes. "default" preserves the
          existing per-mode model and budget caps. "high" promotes every
          mode except `quick` from Sonnet to Opus and instructs the model
          to interpret file caps ~1.5x. "max" promotes ALL modes including
          quick to Opus and removes per-mode caps in the prompt directive
          (the workflow-level timeout remains the upper bound). Use "max"
          for high-stakes PRs (e.g. closing a horizon, large diffs) where
          missing a finding is worse than the extra cost. See ADR-010.
        required: false
        type: string
        default: "default"
    secrets:
      claude_code_oauth_token:
        description: |-
          Anthropic plan-auth token (CLAUDE_CODE_OAUTH_TOKEN). Required;
          this workflow does not support API-key auth.
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: agentic-ops-review-${{ github.repository }}-pr-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Trusted-actor + trigger-phrase gate. This is the central
    # enforcement point. Callers SHOULD also gate at their job level
    # (cheap short-circuit before invoking workflow_call), but security
    # does not depend on that — this gate is the contract. The audit
    # branch includes one literal newline string so `@claude audit`
    # followed by details on later lines reaches the dispatcher.
    if: |
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, '@claude ') &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (
        github.event.issue.pull_request != null ||
        github.event.comment.body == '@claude audit' ||
        startsWith(github.event.comment.body, '@claude audit ') ||
        startsWith(github.event.comment.body, '@claude audit
      ') ||
        startsWith(github.event.comment.body, '@claude audit:')
      )
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      # Caller's default branch at $GITHUB_WORKSPACE root. The Claude
      # action treats $GITHUB_WORKSPACE as a trusted git tree; checking
      # the PR head out at the root would be the antipattern called out
      # in the action's security docs (untrusted ref + privileged context).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 1

      # Determine which ref of agentic-ops to check out as 'central/'.
      # github.workflow_ref looks like one of:
      #   loganrooks/agentic-ops/.github/workflows/review.yml@refs/tags/v1
      #   loganrooks/agentic-ops/.github/workflows/review.yml@refs/heads/main
      #   loganrooks/agentic-ops/.github/workflows/review.yml@<full sha>
      # We checkout the same ref the caller pinned, so the wrapper script
      # version matches the workflow version exactly.
      - name: Determine central ref
        id: central_ref
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          ref="${WORKFLOW_REF#*@}"
          if [[ -z "$ref" || "$ref" == "$WORKFLOW_REF" ]]; then
            echo "error: could not extract ref from workflow_ref=$WORKFLOW_REF" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "central ref resolved to: $ref"

      # Central tooling (this repo: wrapper script, future shared infra)
      # at central/. Pinned to the same ref the caller used.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          repository: loganrooks/agentic-ops
          ref: ${{ steps.central_ref.outputs.ref }}
          path: central
          fetch-depth: 1

      # PR head — the surface being reviewed. Goes into pr-head/ so the
      # action's working tree at root stays trusted; passed to Claude
      # via --add-dir below.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        if: ${{ github.event.issue.pull_request != null }}
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          path: pr-head
          fetch-depth: 50

      # Non-PR audit runs review the caller's default branch at root. Keep
      # an empty pr-head/ so the shared --add-dir argument remains valid.
      - name: Ensure pr-head exists for issue audit
        if: ${{ github.event.issue.pull_request == null }}
        run: mkdir -p pr-head

      - name: Determine review mode
        id: mode
        env:
          BODY: ${{ github.event.comment.body }}
          ENABLED_MODES: ${{ inputs.enabled_modes }}
          EFFORT_LEVEL: ${{ inputs.effort_level }}
        run: |
          set -euo pipefail
          # Extract first non-empty trimmed line. Strict first-line match
          # (vs anywhere-in-body) avoids firing on incidental mentions in
          # discussion threads. Trailing \r is stripped so CRLF/CR line
          # endings (from compromised toolchains or non-web clients) do
          # not silently fail the case match.
          cmd="$(printf '%s\n' "$BODY" | awk 'NF { sub(/\r$/, ""); sub(/^[ \t]+/, ""); sub(/[ \t]+$/, ""); print; exit }')"
          # Cap first-line length to bound prompt-token cost from a
          # trusted-actor posting a deliberately-long trigger. 512 chars
          # is comfortably above any plausible audit-lens or free-form
          # target while preventing 2KB+ payloads from flowing into the
          # billed prompt.
          if [ "${#cmd}" -gt 512 ]; then
            echo "Trigger first line exceeds 512 chars (got ${#cmd})." >&2
            exit 1
          fi
          # Patterns require either exact match ('@claude X') or trailing
          # whitespace ('@claude X ...'); this prevents '@claude reviewing'
          # or '@claude gatesomething' from matching review/gates by prefix.
          audit_target=""
          case "$cmd" in
            "@claude opus"|"@claude opus "*)     mode=opus;   model=claude-opus-4-7   ;;
            "@claude deep"|"@claude deep "*)     mode=deep;   model=claude-sonnet-4-6 ;;
            "@claude quick"|"@claude quick "*)   mode=quick;  model=claude-sonnet-4-6 ;;
            "@claude gates"|"@claude gates "*)   mode=gates;  model=claude-sonnet-4-6 ;;
            "@claude review"|"@claude review "*) mode=review; model=claude-sonnet-4-6 ;;
            "@claude survey"|"@claude survey "*) mode=survey; model=claude-sonnet-4-6 ;;
            "@claude audit"|"@claude audit "*|"@claude audit:"*)
              mode=audit
              model=claude-sonnet-4-6
              # Strip the trigger prefix, then filter to printable + whitespace
              # only. Defends against bidi/zero-width/control unicode (CVE-2021-42574
              # "trojan source" class) flowing into the audit prompt or back into
              # PR comments where a human reviewer would render them. LC_ALL=C
              # forces tr to operate byte-by-byte so the filter is deterministic
              # regardless of the runner's locale; any non-ASCII byte (>=0x80)
              # is dropped. Audit lens names are ASCII by convention.
              audit_target="$(printf '%s' "$cmd" | sed -E 's/^@claude audit:?[[:space:]]*//' | LC_ALL=C tr -cd '[:print:][:space:]')"
              ;;
            *) echo "First line did not match an allowed trigger phrase: '$cmd'" >&2; exit 1 ;;
          esac
          # Validate against this consumer's enabled_modes JSON array.
          if ! echo "$ENABLED_MODES" | jq -e --arg m "$mode" 'index($m) != null' >/dev/null; then
            echo "Mode '$mode' is not in enabled_modes for this repo." >&2
            echo "  enabled_modes=$ENABLED_MODES" >&2
            echo "  trigger=$cmd" >&2
            exit 1
          fi
          # Effort-level override (ADR-010). The dial is orthogonal to mode:
          # mode selects the prompt structure and budget shape; effort scales
          # model power and instructs the model to interpret caps liberally.
          # Validated against a closed set; unknown values fail fast.
          case "$EFFORT_LEVEL" in
            default|"")  effort=default ;;
            high|max)    effort="$EFFORT_LEVEL" ;;
            *)
              echo "Invalid effort_level '$EFFORT_LEVEL'. Must be one of: default, high, max." >&2
              exit 1
              ;;
          esac
          # high: every mode except quick promotes from Sonnet to Opus.
          # max: every mode including quick promotes to Opus.
          # quick is exempt at high effort to preserve its routine-PR purpose
          # (cheap, fast). Callers wanting a deeper quick pass should pass
          # max explicitly.
          if [ "$effort" = "high" ] && [ "$mode" != "quick" ]; then
            model=claude-opus-4-7
          fi
          if [ "$effort" = "max" ]; then
            model=claude-opus-4-7
          fi
          {
            echo "mode=$mode"
            echo "model=$model"
            echo "audit_target=$audit_target"
            echo "effort=$effort"
          } >> "$GITHUB_OUTPUT"
          echo "Selected mode=$mode model=$model effort=$effort"

      # Build dynamic prompt fragments from inputs. Multi-line outputs
      # use the heredoc syntax in $GITHUB_OUTPUT.
      - name: Assemble prompt fragments
        id: prompt_bits
        env:
          REVIEW_FOCUS_PATHS: ${{ inputs.review_focus_paths }}
          GATES_PATHS: ${{ inputs.gates_paths }}
          EFFORT: ${{ steps.mode.outputs.effort }}
        run: |
          set -euo pipefail

          render_paths_block() {
            local label="$1"
            local content="$2"
            if [[ -z "${content//[[:space:]]/}" ]]; then
              echo "$label: (none configured for this repo)"
            else
              echo "$label:"
              printf '%s\n' "$content" | sed '/^[[:space:]]*$/d; s/^[[:space:]]*/  - /'
            fi
          }

          {
            echo "review_focus_block<<__GHA_EOF__"
            render_paths_block "Priority paths in 'review' mode" "$REVIEW_FOCUS_PATHS"
            echo "__GHA_EOF__"
          } >> "$GITHUB_OUTPUT"

          {
            echo "gates_paths_block<<__GHA_EOF__"
            render_paths_block "File matchers in 'gates' mode" "$GATES_PATHS"
            echo "__GHA_EOF__"
          } >> "$GITHUB_OUTPUT"

          # Effort-level directive (ADR-010). Injected near the top of the
          # prompt so the model reads it before the per-mode caps below.
          # The model treats this as a multiplier on attention, not a
          # rewrite of mode semantics.
          case "$EFFORT" in
            default)
              effort_text=$'Effort level: default. Use the per-mode budgets and model selection as written below.'
              ;;
            high)
              effort_text=$'Effort level: HIGH (ADR-010).\n\n- The model has been promoted to Opus for every mode except quick.\n- Where a per-mode budget says "at most N files", interpret as up to round(1.5 * N) when additional files materially change the review (e.g. a referenced reader/writer pair, an ADR cited by a diff hunk, a test that exercises a new gate branch).\n- Do not skim known load-bearing files. If a single file exceeds the per-file attention budget at default effort, spend up to 1.5x the time on it.\n- Survey mode: zones may grow to 10 (vs 8 default) and per-zone files to 9 (vs 6) when justified.\n- Audit mode: total files may grow to 27 (vs 18 default).'
              ;;
            max)
              effort_text=$'Effort level: MAX (ADR-010).\n\n- The model has been promoted to Opus for ALL modes including quick.\n- Per-mode file caps are removed in this run. Read every file you need to support specific findings; the workflow timeout is the only hard cap.\n- For files >500 lines, scan in chunks until the full file is covered. Do not summarize-and-move-on on a partial read.\n- Spend the full workflow timeout (${{ inputs.timeout_minutes }} min). Output the review only when you have either (a) covered the diff materially or (b) hit the timeout warning.\n- Lower the bar for surfacing findings: include low-confidence findings flagged as such. Prefer false positives over false-negative misses on this run.\n- Pattern-match aggressively for: missing checks in newly-added gate functions, reader/writer field-name drift, ADR contradictions, silent-fallback branches, durable-side-effect-before-validation ordering, off-by-one in cap logic, scope-of-checkpoint-vs-scope-of-gate mismatches, and any new "skip" / "tolerate" / "fallback" branch.\n- Spatial decomposition modes (survey, audit): the zone/file caps in the per-mode prose below are removed in this run. Read until you have evidence for findings; do not budget-pad with redundant reads.'
              ;;
          esac

          {
            echo "effort_block<<__GHA_EOF__"
            printf '%s\n' "$effort_text"
            echo "__GHA_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble allowlist
        id: allowlist
        env:
          EXTRA: ${{ inputs.extra_allowed_tools }}
        run: |
          base='Bash(gh pr view:*),Bash(gh pr diff:*),Bash(./central/.github/scripts/post-claude-review.sh:*)'
          if [[ -n "${EXTRA//[[:space:]]/}" ]]; then
            full="${base},${EXTRA}"
          else
            full="${base}"
          fi
          echo "tools=$full" >> "$GITHUB_OUTPUT"

      # NOTE: github.event.comment.body is interpolated into the prompt
      # below and sent to Anthropic's API. The trusted-actor gate above
      # bounds who can fire this workflow but does not sanitize comment
      # content. Reviewers must not paste secrets, tokens, or PII into
      # trigger comments.
      - uses: anthropics/claude-code-action@939ae9c056ecf8a1a01409ddd1c4eadec5f8c77b  # v1.0.116
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          # Allowlist rationale (see also central/.github/scripts/post-claude-review.sh):
          # - gh pr view / gh pr diff: read-only, fetch PR state.
          # - post-claude-review.sh: the ONE allowed posting tool. It
          #   accepts an integer-validated PR/issue number plus an optional
          #   fixed pr|issue surface enum, then reads body from stdin only;
          #   refuses --body-file <path> and any other gh flag. Combined
          #   with the prompt's <<'EOF' (quoted heredoc) discipline,
          #   untrusted PR/issue content cannot be shell-expanded en route
          #   to gh.
          claude_args: '--model ${{ steps.mode.outputs.model }} --add-dir pr-head --allowedTools "${{ steps.allowlist.outputs.tools }}"'
          prompt: |-
            You are reviewing a repository event for ${{ inputs.repo_label != '' && inputs.repo_label || github.event.repository.name }}.
            Invoked mode: ${{ steps.mode.outputs.mode }}.
            Audit target: ${{ steps.mode.outputs.audit_target }}.

            ${{ steps.prompt_bits.outputs.effort_block }}

            Workspace layout:
            - Caller's default branch at the repository root.
            - For PR-triggered modes, PR head is at `pr-head/` — the surface you are reviewing.
            - For non-PR issue-triggered audit, `pr-head/` is intentionally empty; review the repository root.
            - Central tooling (post-comment wrapper) at `central/`.

            When PR-mode instructions reference file paths like `foo/bar.py`,
            look for them at `pr-head/foo/bar.py`. In non-PR issue audit,
            look for repository paths at the root.

            Triggering comment (verbatim, between markers):
            >>>BEGIN_COMMENT
            ${{ github.event.comment.body }}
            >>>END_COMMENT

            Use the triggering comment for targeting hints: explicit file
            paths, mentioned concerns, references to ADRs or modules, or
            free-form narrative about what to scrutinize. The PR description
            may also contain a "Focus:" section naming surfaces the author
            wants reviewed; treat that as an additional target source.

            Repo-specific configuration for this PR:
            ${{ steps.prompt_bits.outputs.review_focus_block }}

            ${{ steps.prompt_bits.outputs.gates_paths_block }}

            Audit lens registry JSON:
            ${{ inputs.audit_lens_registry }}

            Mode behavior:
            * review (default): focused pass on the PR diff. Read at most
              15 files. If priority paths are configured above, weight your
              attention there first; otherwise treat the diff as uniform.
              Skip benchmarks, schemas, and planning narratives entirely.
            * quick: scan the diff only for obvious AI-failure-mode issues
              (hallucinated references, silent fallbacks, magic values,
              stale docstrings). Read at most 5 files. Output one short
              comment. Use this mode for routine PRs.
            * deep: thorough pass across the full diff with no budget cap.
              Read what you need. Use only when the reviewer wants depth.
            * gates: review only files matching the gates path matchers
              listed above. If no matchers are configured for this repo,
              post a single short comment explaining gates mode is not
              enabled here and stop. When matchers ARE configured: check
              for new skip/tolerate/fallback branches in gate logic,
              cross-file vocabulary mismatch (reader vs writer field
              names), and shell hardening on gate scripts.
            * opus: targeted, expensive deep-reasoning pass on a small
              surface. REQUIRES explicit targeting. Acceptable target
              sources, in priority order:
              1. The triggering comment names specific files, modules,
                 ADR numbers, or a clear concern.
              2. The PR description has a "Focus:" section naming the
                 surfaces the author wants scrutinized.
              3. The PR is small enough (≤10 changed files) that the
                 entire diff IS the focus.
              If none of these are met — bare `@claude opus`, no Focus
              section, large diff — DO NOT review. Post a single short
              comment explaining that opus mode requires explicit targeting
              and listing the three acceptable target sources above. Stop
              without spending the reasoning budget. When targeting IS
              clear: read at most 3 files. Spend the budget on subtle
              issues pattern matching would miss: cross-file invariant
              violations, ADR contradictions, second-order effects of new
              gate branches, contract drift between reader and writer.
              Output high-confidence findings only — terse over verbose.
              Skip anything Sonnet would also catch; this mode is for
              things that need Opus-level reasoning to be reliably surfaced.
            * survey: spatial-decomposition review for large PRs (>50 files
              or >5K changed lines). Single-agent path (L1) — Phase 1-4
              sequential.

              PHASE 1 — Zone map.
              Run `gh pr diff ${{ github.event.issue.number }} --name-only`
              to list changed files. Run
              `gh pr diff ${{ github.event.issue.number }} --stat` to size
              them. Build internally a list of 3-8 zones, each with: (a)
              zone-id (kebab-case), (b) path globs covered, (c) suspected
              concern category (auth/contract/scaffolding/docs/test/infra/data),
              (d) priority (P1/P2/P3) based on apparent load-bearing-ness.
              Cap zones at 8. DO NOT post yet.

              PHASE 2 — Per-zone deep read.
              For each P1 then P2 zone, in turn:
                - Read at most 6 files within that zone (prefer most-changed
                  files per the --stat output).
                - Pattern-match for AI-failure modes specific to the zone's
                  category:
                    auth zones → secret leaks, missing input validation,
                                 hardcoded credentials, weak crypto choices
                    contract zones → reader/writer field-name mismatch,
                                     schema drift, breaking API changes
                    scaffolding zones → declared-but-unused symbols, code
                                        paths with no test coverage,
                                        speculative abstractions
                    docs zones → claims that contradict code, stale
                                 references, forgotten TODO/FIXME, outdated
                                 examples
                    test zones → tests asserting on absent code, fragile
                                  mocks, bare-except swallowing, flaky timing
                    infra zones → unpinned deps, missing timeouts, broad shell
                                   injection, missing concurrency guards
                    data zones → missing migration backwards-compat, unindexed
                                  queries on hot path, schema-vs-validation
                                  drift
                - Note findings inline in scratchpad with: file:line,
                  severity (critical/warning/suggestion), one-sentence
                  concern.
                - DO NOT post per-zone.

              PHASE 3 — Cross-zone integrity.
              Read pr-head/${{ inputs.agents_md_path }} plus up to 5 ADRs
              from pr-head/.planning/decisions/ADR-*.md or
              pr-head/docs/adr/ADR-*.md (6 files total). Identify:
                - ADR violations introduced by this diff (cite ADR# + line)
                - Vocabulary drift between writer (e.g., template generator)
                  and reader (e.g., parser) within the diff
                - Gate-script changes whose downstream readers were not
                  updated
                - Hook-enforced commitments (per AGENTS.md) violated by the
                  diff

              PHASE 4 — Synthesis + post.
              Run `gh pr view ${{ github.event.issue.number }} --comments` to
              see existing CodeRabbit / Codex / Claude findings. Dedupe yours
              against theirs (skip findings already raised; note dupes
              briefly). Order findings: P1 first, then P2, then P3. Within
              each priority, group by zone. Prepend a metadata header
              (illustrative — output this verbatim wrapped in triple-backticks
              in the comment):

                  Mode: survey | Model: <model> | Effort: <effort>
                  Zones: <count> | Files read: <count>
                  Runtime: <approx-seconds>s | Run: <run_url>

              Post ONE comment via the wrapper script:

                  ./central/.github/scripts/post-claude-review.sh ${{ github.event.issue.number }} pr <<'EOF'
                  <body>
                  EOF

              If body exceeds ~50KB, prioritize critical/warning over
              suggestion; cap and add a "[truncated; N more findings omitted]"
              note.

              Budget caps:
                - Max files read in Phase 2: 6 per zone × 8 zones = 48 max
                - Max files read in Phase 3: 6 (AGENTS.md + up to 5 ADRs)
                - Hard timeout: ${{ inputs.timeout_minutes }} min (workflow-level)

            * audit: whole-codebase review against a question or lens. A
              target is recommended but not required — bare `@claude audit`
              runs the default lens `audit:agential-dx` and must note that
              implicit default in the report header.

              Lens parsing:
                - Read the extracted target from
                  `steps.mode.outputs.audit_target` (shown above as Audit target).
                - If audit_target is empty, use built-in lens
                  `audit:agential-dx`.
                - Else if audit_target starts with a known lens id
                  (`agential-dx`, `tech-debt`, `forward-compat`,
                  `discipline`), use that built-in lens from the registry.
                - Otherwise, treat the entire audit_target as a free-form
                  question and build an ad-hoc lens.

              Workspace context:
                - PR comment trigger: review `pr-head/`.
                - Issue comment trigger (non-PR): review the repository root
                  at the caller's default branch.

              Whole-codebase navigation strategy:
                - DO NOT attempt to read every file. Sample, do not enumerate.
                - PHASE 1 — Discipline map (read 3-6 files): AGENTS.md or
                  equivalent, README.md, roadmap/horizon docs if present,
                  ADR titles and relevant ADR full text, CONTRIBUTING.md if
                  present. Build a concise map of what the repo claims about
                  itself.
                - PHASE 2 — Lens-driven sampling (read 6-12 files): identify
                  load-bearing surfaces relevant to the selected lens and
                  sample representative files. Goal: enough evidence to support
                  specific findings, not exhaustive coverage.
                - PHASE 3 — Synthesize against the lens.
                - PHASE 4 — Post on the triggering surface.

              Built-in lens guidance:
                - audit:agential-dx — workspace organization for AI
                  contributors: operative-discipline docs, ADR coverage,
                  runbooks, context freshness, do-not-do lists, and whether an
                  AI contributor can contribute safely.
                - audit:tech-debt — TODO/FIXME/HACK density, duplicated logic,
                  commented-out code, speculative scaffolding, doc-code drift,
                  and deprecated patterns the repo's own ADRs flag.
                - audit:forward-compat — readiness for the next roadmap phase:
                  architecture fit, likely refactors, ADR pressure, and pre-work
                  that should happen now versus when the phase begins.
                - audit:discipline — AGENTS.md and ADR commitments versus repo
                  reality; distinguish hook-enforced commitments from
                  discipline-only commitments.
                - Free-form — state that the audit used a free-form question
                  and recommend promoting it to a named lens if it recurs.

              Output format:
                - Prepend a metadata header:

                    Mode: audit | Lens: <id-or-"free-form"> | Model: <model> | Effort: <effort>
                    Files read: <n> | Directories traversed: <n>
                    Runtime: <sec>s | Commit SHA: <sha> | Run: <url>

                - Findings sectioned by severity
                  (Critical/Warning/Suggestion).
                - Each finding includes title, evidence (file:line citations),
                  reasoning, and recommended action.
                - If body exceeds ~50KB, split into at most 5 wrapper
                  invocations prefixed `[Audit N/M]`, ordered critical first.

              Posting target:
                - PR comment trigger (`github.event.issue.pull_request != null`)
                  posts via:

                    ./central/.github/scripts/post-claude-review.sh ${{ github.event.issue.number }} pr <<'EOF'
                    <body>
                    EOF

                - Issue comment trigger (`github.event.issue.pull_request == null`)
                  posts via:

                    ./central/.github/scripts/post-claude-review.sh ${{ github.event.issue.number }} issue <<'EOF'
                    <body>
                    EOF

              Budget caps:
                - Max files read total: 18 (Phase 1: 6, Phase 2: 12)
                - Max comment chunks: 5
                - Hard timeout: ${{ inputs.timeout_minutes }} min (workflow-level)

            Across all modes:
            * For PR-triggered modes, read AGENTS.md once (at
              `pr-head/${{ inputs.agents_md_path }}`) for the operative
              discipline. For non-PR issue audit, read
              `${{ inputs.agents_md_path }}` at the repository root. If that
              file does not exist, proceed without it — do not invent contents.
            * Focus on AI-authored-code failure modes (hallucinated refs,
              silent fallbacks, speculative scaffolding, stale docs, magic
              values) over style.
            * Available shell tools:
              - For PR triggers, `gh pr view ${{ github.event.issue.number }} --comments`
                to see existing CodeRabbit / Codex findings and avoid
                duplicating them.
              - For PR triggers, `gh pr diff ${{ github.event.issue.number }}`
                to inspect the diff if needed.
              - `./central/.github/scripts/post-claude-review.sh <number> [pr|issue]`
                — the ONLY way to post your final review or audit (see below).
              You do NOT have access to test runners (pytest, schema
              validators, etc.) or to `gh pr comment` directly; when the
              PR description names verifications, judge whether they are
              plausible and specific without trying to execute them.
            * For PR-triggered modes other than audit, post your review as a
              single top-level PR comment by piping the body into the wrapper
              script via a QUOTED heredoc. The single quotes around `'EOF'`
              are required — they prevent bash from expanding $(...), $var, or
              backticks in your review text before the wrapper sees it:

                  ./central/.github/scripts/post-claude-review.sh ${{ github.event.issue.number }} pr <<'EOF'
                  <your review body here, multi-line OK>
                  EOF

              Post exactly one comment unless audit split-output rules apply.
              Do not post inline comments. Do not modify code. Do not attempt
              to use `gh pr comment` or `gh issue comment` directly — they are
              not in the allowlist.
